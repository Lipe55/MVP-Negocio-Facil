server {
 listen 8080;
 # Default: trust no additional proxy. Mount explicit set_real_ip_from entries
 # here only when an HTTPS ingress is configured (see docs/security-fixes.md).
 include /etc/nginx/trusted-proxies.conf;
 real_ip_header X-Forwarded-For;
 real_ip_recursive on;
 server_tokens off;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ {
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
  # IP is this trusted reverse proxy's socket peer, never a caller-provided header.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  access_log off;
 }
 # Public tokens must not appear in access logs or external referrers.
 location /o/ { access_log off; try_files $uri /index.html; }
 location / { try_files $uri /index.html; }
}
