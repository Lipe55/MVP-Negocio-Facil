services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-negocio_facil}
      POSTGRES_USER: ${DATABASE_USER:-negocio_facil}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-negocio_facil}
      DATABASE_USER: ${DATABASE_USER:-negocio_facil}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      DANFSE_URL: ${DANFSE_URL:-http://danfse:8080}
      DANFSE_TIMEOUT: ${DANFSE_TIMEOUT:-8s}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    depends_on:
      db:
        condition: service_healthy
    networks: [default, fiscal]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/health", "com.negociofacil.config.HealthProbe"]
      interval: 5s
      timeout: 5s
      retries: 30
  danfse:
    build: ./danfse
    networks: [fiscal]
    environment:
      XML_MAX_SIZE_BYTES: "1048576"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
networks:
  fiscal:
    internal: true
