spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/negocio_facil}
    username: ${DATABASE_USER:negocio_facil}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    jdbc:
      initialize-schema: never
    timeout: 8h
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "172\\.(1[6-9]|2[0-9]|3[01])\\.\\d{1,3}\\.\\d{1,3}"
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
app:
  allowed-origin: ${APP_ORIGIN:http://localhost:5173}
